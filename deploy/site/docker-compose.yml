# The public website (thechilli.zonov.ai) as its OWN small stack: independent of the Prod and UAT stacks, so deploying either one never
# touches it and UAT carries no copy of it. Only the static site runs here; /signup, /_next, /brand and the Razorpay webhook of that
# hostname are sent to the Prod stack by the host nginx (scripts/render-site-nginx.sh). Listens on 127.0.0.1:${SITE_PORT:-7095} only.
#   docker compose -f deploy/site/docker-compose.yml up -d --build        (the deploy workflow does this when src/web-site changes)
name: thechilli-site
services:
  web-site:
    build:
      context: ../../src/web-site
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
        NODE_IMAGE: node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    image: thechilli-site-web
    ports:
      - "127.0.0.1:${SITE_PORT:-7095}:8080"
    cap_drop: [ALL]
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-file: "5", max-size: 20m }
    mem_limit: 64m
    memswap_limit: 96m
    oom_score_adj: 500
    read_only: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
