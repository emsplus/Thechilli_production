<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Menu</title>
<link rel="icon" href="/qr-static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/qr-static/tq.css">
<script src="/qr-static/common.js" defer></script>
<script src="/qr-static/menu.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="title-row">
      <h1 id="rest">Menu</h1>
      <span id="table" class="table-tag" hidden></span>
    </div>
    <div class="search" id="search-wrap" hidden>
      <label class="sr" for="q">Search the menu</label>
      <input id="q" type="search" placeholder="Search dishes" autocomplete="off" enterkeyhint="search">
    </div>
    <nav class="chips" id="chips" aria-label="Menu sections" hidden></nav>
  </div>
</header>
<main id="main" aria-busy="true">
  <div id="loading" role="status" aria-label="Loading the menu"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div id="menu"></div>
  <p id="none" class="empty" hidden>No dishes match your search.</p>
  <div id="state" class="state" hidden role="alert"></div>
  <p id="view-note" class="note" hidden>This menu is for viewing. Please order with your server.</p>
  <p id="tax" class="note" hidden></p>
  <div id="cta" class="cta" hidden><p>Enjoying your meal? Tell us how we did.</p><a id="cta-link" class="btn" href="#">Rate your visit</a></div>
</main>
<footer>Menu by <strong>Chilli Agent</strong></footer>
</body>
</html>
