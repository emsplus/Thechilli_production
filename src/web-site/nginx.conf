# web-site: static SPA. Replaces /etc/nginx/conf.d/default.conf of nginxinc/nginx-unprivileged (listens on 8080, non-root).
server {
    listen 8080;   # IPv4 only: the router reaches us over the Docker network (no [::] listen, which fails where IPv6 is off)
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml text/xml;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite output: content-hashed file names, safe to cache for a year. A missing asset is a 404, never the HTML shell.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The HTML shell must be revalidated so a new deploy is picked up at once.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA: real files are served (images, icons, manifest; one day); every other path is a client-side route -> /index.html.
    # No `$uri/` on purpose: /menu is both a route and the public/menu/ image folder (a directory match would give 403).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
