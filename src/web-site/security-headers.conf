# Included in every location that sets its own headers (nginx drops server-level add_header in a location that has any).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Scripts only from this origin (Vite emits no inline script). Styles: own CSS, Google Fonts CSS, and inline style attributes set by
# React/motion. Fonts from Google Fonts. mailto: links are not restricted by CSP. connect-src: the contact form posts to the public leads endpoint of the marketing service on the API host (CORS there allows this site).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://api.thechilli.zonov.ai; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'; upgrade-insecure-requests" always;
