[project]
name = "tax-engine-in"
version = "0.2.0"
description = "Deterministic India GST calculation library for restaurant billing - rules UNVERIFIED, see docs/RULES.md"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
