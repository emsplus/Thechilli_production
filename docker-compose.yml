      - POS_BASE_URL=https://${DOMAIN_API}${PUBLIC_PORT_SUFFIX:-}
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 20m
    mem_limit: 512m
    networks:
      default: null
    oom_score_adj: 500
    profiles:
