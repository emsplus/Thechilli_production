      - ADMIN_API_KEY=${AGGREGATOR_ADMIN_API_KEY:?}
      - DATABASE_URL=postgresql+psycopg://aggregator_app:${AGGREGATOR_DB_PASSWORD}@db:5432/aggregator
      - ENABLE_MOCK_PROVIDER=false
      - ENV=production
      - FORWARDED_ALLOW_IPS=${PROXY_IP}
      - INTERNAL_JWT_SECRET=${AGGREGATOR_INTERNAL_JWT_SECRET:?run deploy.sh, it generates
        AGGREGATOR_INTERNAL_JWT_SECRET}
