<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Rate your visit</title>
<link rel="icon" href="/qr-static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/qr-static/tq.css">
<script src="/qr-static/common.js" defer></script>
<script src="/qr-static/review.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="title-row">
      <h1 id="rest">Rate your visit</h1>
      <span id="table" class="table-tag" hidden></span>
    </div>
  </div>
</header>
<main id="main" aria-busy="true">
  <div id="loading" role="status" aria-label="Loading"><div class="skel"></div></div>
  <div id="state" class="state" hidden role="alert"></div>
  <form id="form" class="card" novalidate hidden>
    <fieldset>
      <legend id="rating-legend">How was your visit? <span class="sr">(required)</span></legend>
      <div class="stars" id="stars" role="radiogroup" aria-labelledby="rating-legend" aria-required="true">
        <label class="star"><input type="radio" name="rating" value="5" aria-label="5 stars, excellent"><span aria-hidden="true">★</span></label>
        <label class="star"><input type="radio" name="rating" value="4" aria-label="4 stars, good"><span aria-hidden="true">★</span></label>
        <label class="star"><input type="radio" name="rating" value="3" aria-label="3 stars, okay"><span aria-hidden="true">★</span></label>
        <label class="star"><input type="radio" name="rating" value="2" aria-label="2 stars, poor"><span aria-hidden="true">★</span></label>
        <label class="star"><input type="radio" name="rating" value="1" aria-label="1 star, very poor"><span aria-hidden="true">★</span></label>
      </div>
      <p id="rating-text" class="rating-text" aria-live="polite">Tap a star</p>
    </fieldset>
    <label class="field" for="comment">Anything to tell us? <span class="opt">(optional)</span></label>
    <textarea id="comment" name="comment" maxlength="500" aria-describedby="count"></textarea>
    <span id="count" class="count">0 / 500</span>
    <label class="field" for="name">Your name <span class="opt">(optional)</span></label>
    <input class="text" id="name" name="name" maxlength="80" autocomplete="name">
    <label class="field" for="contact">Phone or email <span class="opt">(optional)</span></label>
    <input class="text" id="contact" name="contact" maxlength="120" autocomplete="tel" inputmode="email" aria-describedby="contact-hint">
    <p id="contact-hint" class="hint">Only if you would like the restaurant to get back to you.</p>
    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <p id="err" class="err" role="alert" hidden></p>
    <div class="actions"><button id="send" class="btn block" type="submit">Send review</button></div>
  </form>
  <div id="thanks" class="thanks" hidden>
    <div class="big" aria-hidden="true">✓</div>
    <h2 id="thanks-title" tabindex="-1">Thank you!</h2>
    <p>Your review has reached the restaurant.</p>
    <p id="google" hidden><a id="google-link" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer">Also share it on Google</a></p>
  </div>
</main>
<footer>Reviews by <strong>Chilli Agent</strong></footer>
</body>
</html>
